      body: |-
        **Un corso che riprende lo spirito dei fondatori per sviluppare forza e disciplina nel corpo e nella mente.**

        Lavoriamo sulle tecniche e sui principi fondamentali del parkour, con un'attenzione particolare alla preparazione fisica e mentale, per imparare ad affrontare scenari sempre più impegnativi.

        *Età consigliata: 14-25*

