# Configurazione del pannello (Sveltia CMS) – https://sveltiacms.app
backend:
  name: github
  repo: Sgummyy/UncensoredSite
  branch: main
  commit_messages:
    create: 'Nuovo contenuto: {{slug}}'
    update: 'Modifica: {{slug}}'
    delete: 'Eliminato: {{slug}}'
    uploadMedia: 'Caricata immagine: {{path}}'
    deleteMedia: 'Eliminata immagine: {{path}}'
site_url: https://www.uncensoredrunners.com
display_url: https://www.uncensoredrunners.com
logo_url: /assets/logo-192.png
locale: it
media_folder: static/uploads
public_folder: /uploads
collections:
- name: posts
  label: Articoli del blog
  label_singular: Articolo
  icon: edit_note
  folder: content/posts
  extension: md
  format: frontmatter
  create: true
  slug: '{{year}}-{{month}}-{{day}}-{{slug}}'
  summary: '{{title}} · {{date}}'
  sortable_fields:
  - date
  - title
  sort_by:
    field: date
    direction: descending
  fields:
  - name: title
    label: Titolo
    widget: string
  - name: date
    label: Data di pubblicazione
    widget: datetime
    time_format: false
    date_format: DD/MM/YYYY
    format: YYYY-MM-DD
  - name: cover
    label: Foto di copertina
    widget: image
    required: false
  - name: excerpt
    label: Anteprima (2-3 righe mostrate nell'elenco del blog)
    widget: text
    required: false
  - name: description
    label: Descrizione per Google (facoltativa)
    widget: text
    required: false
  - name: draft
    label: Bozza (non pubblicare ancora)
    widget: boolean
    default: false
    required: false
  - name: url
    label: Indirizzo della pagina
    widget: string
    required: false
    hint: 'Lascia vuoto per i nuovi articoli: viene creato in automatico dal titolo. Non modificarlo negli articoli già pubblicati.'
  - name: body
    label: Testo dell'articolo
    widget: markdown
- name: pages
  label: Pagine
  label_singular: Pagina
  icon: description
  folder: content/pages
  extension: yml
  format: yml
  create: true
  slug: '{{slug}}'
  summary: '{{menu_label}} ({{url}})'
  sortable_fields:
  - order
  - menu_label
  sort_by:
    field: order
    direction: ascending
  fields:
  - name: title
    label: Titolo grande della pagina
    widget: string
  - name: subtitle
    label: Sottotitolo
    widget: text
    required: false
  - name: tag
    label: Etichetta rossa sopra il titolo
    widget: string
    required: false
  - name: head_image
    label: Foto nell'intestazione (facoltativa)
    widget: image
    required: false
    hint: Se vuota, viene usata la prima foto della pagina.
  - name: head_image_alt
    label: Descrizione della foto nell'intestazione
    widget: string
    required: false
  - name: head_image_caption
    label: Didascalia della foto in cima
    widget: string
    required: false
  - name: notice
    label: Avviso in evidenza (facoltativo)
    widget: text
    required: false
  - name: blocks
    label: Contenuto della pagina
    label_singular: blocco
    widget: list
    required: false
    types:
    - name: heading
      label: Titolo
      fields:
      - name: text
        label: Testo del titolo
        widget: string
      - name: level
        label: Dimensione
        widget: select
        options:
        - label: Grande
          value: 2
        - label: Piccolo
          value: 3
        default: 2
    - name: text
      label: Testo
      fields:
      - name: body
        label: Testo
        widget: markdown
    - name: image
      label: Foto
      fields:
      - name: src
        label: Foto
        widget: image
      - name: alt
        label: Descrizione della foto (per Google e accessibilità)
        widget: string
        required: false
      - name: caption
        label: Didascalia
        widget: string
        required: false
      - name: link
        label: Link al clic (facoltativo)
        widget: string
        required: false
    - name: button
      label: Pulsante
      fields:
      - name: question
        label: Domanda sopra il pulsante (facoltativa)
        widget: string
        required: false
      - name: text
        label: Testo del pulsante
        widget: string
      - name: link
        label: Link (es. /contatti/parkour-padova/)
        widget: string
      - name: style
        label: Stile
        widget: select
        options:
        - label: Rosso pieno
          value: rosso
        - label: Contorno
          value: contorno
        default: contorno
    - name: video
      label: Video YouTube
      fields:
      - name: youtube
        label: Link o codice del video YouTube
        widget: string
      - name: poster
        label: Foto di copertina (facoltativa, evita di caricare YouTube prima del consenso)
        widget: image
        required: false
    - name: document
      label: Documento PDF
      fields:
      - name: title
        label: Titolo
        widget: string
      - name: description
        label: Descrizione
        widget: string
        required: false
      - name: file
        label: File
        widget: file
    - name: form
      label: Modulo contatti
      fields:
      - name: title
        label: Titolo sopra il modulo (facoltativo)
        widget: string
        required: false
    - name: facebook
      label: Pulsante Facebook
      fields: []
    - name: divider
      label: Separatore
      fields: []
    - name: columns
      label: Colonne affiancate
      fields:
      - name: layout
        label: Larghezza
        widget: select
        required: false
        options:
        - label: Uguali
          value: uguali
        - label: Stretta + larga
          value: stretta-larga
        - label: Larga + stretta
          value: larga-stretta
      - name: columns
        label: Colonne
        label_singular: colonna
        widget: list
        fields:
        - name: blocks
          label: Contenuto della colonna
          label_singular: blocco
          widget: list
          types:
          - name: heading
            label: Titolo
            fields:
            - name: text
              label: Testo del titolo
              widget: string
            - name: level
              label: Dimensione
              widget: select
              options:
              - label: Grande
                value: 2
              - label: Piccolo
                value: 3
              default: 2
          - name: text
            label: Testo
            fields:
            - name: body
              label: Testo
              widget: markdown
          - name: image
            label: Foto
            fields:
            - name: src
              label: Foto
              widget: image
            - name: alt
              label: Descrizione della foto (per Google e accessibilità)
              widget: string
              required: false
            - name: caption
              label: Didascalia
              widget: string
              required: false
            - name: link
              label: Link al clic (facoltativo)
              widget: string
              required: false
          - name: button
            label: Pulsante
            fields:
            - name: question
              label: Domanda sopra il pulsante (facoltativa)
              widget: string
              required: false
            - name: text
              label: Testo del pulsante
              widget: string
            - name: link
              label: Link (es. /contatti/parkour-padova/)
              widget: string
            - name: style
              label: Stile
              widget: select
              options:
              - label: Rosso pieno
                value: rosso
              - label: Contorno
                value: contorno
              default: contorno
          - name: video
            label: Video YouTube
            fields:
            - name: youtube
              label: Link o codice del video YouTube
              widget: string
            - name: poster
              label: Foto di copertina (facoltativa)
              widget: image
              required: false
          - name: document
            label: Documento PDF
            fields:
            - name: title
              label: Titolo
              widget: string
            - name: description
              label: Descrizione
              widget: string
              required: false
            - name: file
              label: File
              widget: file
          - name: form
            label: Modulo contatti
            fields:
            - name: title
              label: Titolo sopra il modulo (facoltativo)
              widget: string
              required: false
          - name: facebook
            label: Pulsante Facebook
            fields: []
          - name: divider
            label: Separatore
            fields: []
  - name: intro
    label: Testo sopra il modulo (solo pagina Contatti)
    widget: text
    required: false
  - name: trust
    label: Punti di fiducia sotto il modulo (solo pagina Contatti)
    label_singular: punto
    widget: list
    required: false
  - name: show_cta
    label: Mostra il riquadro "Prenota la prova" in fondo
    widget: boolean
    default: true
    required: false
  - name: seo_title
    label: Titolo per Google
    widget: string
    required: false
  - name: description
    label: Descrizione per Google
    widget: text
    required: false
  - name: menu_label
    label: Nome breve (percorso e mappa del sito)
    widget: string
  - name: url
    label: Indirizzo della pagina
    widget: string
    hint: Es. /corsi-estivi/ – non modificarlo nelle pagine esistenti, Google le conosce con questo indirizzo.
  - name: parent
    label: Pagina madre (per il percorso)
    widget: string
    required: false
  - name: order
    label: Ordine
    widget: number
    value_type: int
    required: false
  - name: layout
    label: Tipo di pagina
    widget: select
    options:
    - label: Standard
      value: standard
    - label: Contatti
      value: contatti
    - label: Elenco blog
      value: blog
    default: standard
  - name: noindex
    label: Nascondi a Google
    widget: boolean
    default: false
    required: false
- name: site
  label: Home e impostazioni
  icon: settings
  files:
  - name: home
    label: Pagina Home
    file: content/home.yml
    fields:
    - name: hero
      label: Apertura (titolo sopra il carosello)
      widget: object
      fields:
      - name: image
        label: Foto per le condivisioni social
        widget: image
      - name: tag
        label: Etichetta sopra il titolo
        widget: string
      - name: title_1
        label: Titolo – inizio
        widget: string
      - name: title_2
        label: Titolo – parola evidenziata
        widget: string
      - name: title_3
        label: Titolo – fine
        widget: string
        required: false
      - name: lead
        label: Frase sotto il titolo
        widget: text
      - name: button
        label: Pulsante principale
        widget: string
      - name: button_2
        label: Testo pulsante telefono (es. "Chiama")
        widget: string
      - name: badge_1
        label: Etichetta bianca – riga 1
        widget: string
        required: false
      - name: badge_2
        label: Etichetta bianca – parola rossa
        widget: string
        required: false
    - name: gallery
      label: Carosello foto dell'apertura
      label_singular: foto
      widget: list
      fields:
      - name: image
        label: Foto
        widget: image
      - name: caption
        label: Didascalia
        widget: string
        required: false
      - name: position
        label: Punto da tenere al centro (es. 50% 30%)
        widget: string
        required: false
        hint: Prima cifra = orizzontale, seconda = verticale. 50% 20% tiene visibile la parte alta della foto.
    - name: facts
      label: Punti in evidenza (sotto il carosello)
      label_singular: punto
      widget: list
      fields:
      - name: title
        label: Titolo
        widget: string
      - name: text
        label: Testo
        widget: text
    - name: journey_title
      label: Percorso – etichetta iniziale
      widget: string
    - name: courses_eyebrow
      label: Passo 1 – etichetta
      widget: string
    - name: courses_title
      label: Passo 1 – titolo
      widget: string
    - name: courses_text
      label: Passo 1 – nota sotto il titolo
      widget: text
    - name: courses
      label: Corsi per età
      label_singular: corso
      widget: list
      fields:
      - name: label
        label: Età o nome
        widget: string
      - name: text
        label: Descrizione
        widget: text
      - name: link
        label: Link
        widget: string
    - name: where_eyebrow
      label: Passo 2 – etichetta
      widget: string
    - name: where_title
      label: Passo 2 – titolo
      widget: string
    - name: where_text
      label: Passo 2 – testo
      widget: text
    - name: where_image
      label: Passo 2 – foto rotonda
      widget: image
    - name: places
      label: Passo 2 – sedi
      label_singular: sede
      widget: list
      field:
        name: place
        label: Sede
        widget: string
    - name: schedule_title
      label: Passo 2 – titolo tabella orari
      widget: string
    - name: schedule
      label: Passo 2 – orari
      label_singular: orario
      widget: list
      fields:
      - name: name
        label: Corso
        widget: string
      - name: when
        label: Giorno e ora
        widget: string
    - name: trainers_eyebrow
      label: Passo 3 – etichetta
      widget: string
    - name: trainers_title
      label: Passo 3 – titolo
      widget: string
    - name: trainers_text
      label: Passo 3 – testo
      widget: text
    - name: quote
      label: Passo 3 – citazione del fondatore
      widget: object
      fields:
      - name: eyebrow
        label: Frase sopra
        widget: string
      - name: text
        label: Citazione
        widget: text
      - name: author
        label: Autore
        widget: string
      - name: role
        label: Ruolo
        widget: string
      - name: image
        label: Foto
        widget: image
    - name: paths_title
      label: Titolo delle schede
      widget: string
    - name: paths
      label: Schede "Da dove vuoi iniziare"
      label_singular: scheda
      widget: list
      fields:
      - name: question
        label: Domanda
        widget: string
      - name: title
        label: Titolo
        widget: string
      - name: action
        label: Testo del link
        widget: string
      - name: link
        label: Link
        widget: string
    - name: finish_eyebrow
      label: Riquadro contatti – etichetta
      widget: string
    - name: contact_title
      label: Titolo riquadro contatti
      widget: string
    - name: contact_text
      label: Testo riquadro contatti
      widget: text
    - name: social_title
      label: Titolo sezione social
      widget: string
    - name: videos
      label: Video YouTube (link o codici)
      widget: list
      field:
        name: video
        label: Video
        widget: string
    - name: facebook_text
      label: Testo riquadro Facebook
      widget: text
    - name: band_title
      label: Testo della fascia rossa
      widget: string
    - name: seo_title
      label: Titolo per Google
      widget: string
    - name: description
      label: Descrizione per Google
      widget: text
  - name: settings
    label: Contatti, menu e impostazioni
    file: content/settings.yml
    fields:
    - name: site_name
      label: Nome del sito
      widget: string
    - name: tagline
      label: Sotto il logo
      widget: string
    - name: phone
      label: Telefono
      widget: string
    - name: email
      label: Email
      widget: string
    - name: facebook
      label: Pagina Facebook
      widget: string
      required: false
    - name: instagram
      label: Profilo Instagram
      widget: string
      required: false
    - name: youtube
      label: Canale YouTube
      widget: string
      required: false
    - name: footer_text
      label: Testo nel piè di pagina
      widget: text
    - name: cta_title
      label: Titolo del riquadro "Prenota la prova"
      widget: string
    - name: legal_name
      label: Ragione sociale
      widget: string
    - name: menu
      label: Menu principale
      label_singular: voce
      widget: list
      fields:
      - name: label
        label: Nome
        widget: string
      - name: link
        label: Link
        widget: string
      - name: children
        label: Sottomenu
        label_singular: voce
        widget: list
        required: false
        fields:
        - name: label
          label: Nome
          widget: string
        - name: link
          label: Link
          widget: string
    - name: menu_button
      label: Pulsante rosso nel menu
      widget: object
      fields:
      - name: label
        label: Testo
        widget: string
      - name: link
        label: Link
        widget: string
    - name: areas
      label: Zone servite (per Google)
      widget: list
      required: false
    - name: domain
      label: Indirizzo del sito
      widget: string
