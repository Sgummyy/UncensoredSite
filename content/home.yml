facts:
- title: Istruttori formati
  text: Almeno sei mesi di formazione e tirocinio ed esame teorico e pratico prima di insegnare.
- title: Riconosciuti C.S.E.N.
  text: Formazione nazionale degli istruttori di parkour, riconosciuta C.O.N.I. e M.I.U.R.
- title: Prima lezione gratuita
  text: In 8 sedi tra Padova e provincia.
courses_title: Un gruppo per ogni età
courses_text: 'Le età sono indicative: ogni esercizio viene adattato alle esigenze e possibilità di ognuno.'
courses:
- label: 3–4 anni
  text: Capacità motorie di base e sicurezza nel movimento. 40 minuti.
  link: /bambini-e-ragazzi/
- label: 5–7 anni
  text: Capacità motorie generali e coordinative. 55 minuti.
  link: /bambini-e-ragazzi/
- label: 8–10 anni
  text: 'Tecnica del movimento: postura, precisione e disciplina. 60 minuti.'
  link: /bambini-e-ragazzi/
- label: 11–13 anni
  text: Tecniche avanzate e qualità del movimento. 60 minuti.
  link: /bambini-e-ragazzi/
- label: Ragazzi e adulti
  text: Parkour yamak, parkour rivisitato, parkour morbido, yoga in movimento e hatha yoga.
  link: /parkour-movimentonaturale-yoga-padova/
contact_title: Contattaci per una lezione di prova gratuita
contact_text: 'Scrivici l''età e le preferenze: ti proponiamo il gruppo e la sede più comodi.'
