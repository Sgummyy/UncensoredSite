seo_title: Uncensored Runners | Scuola di parkour a Padova
description: Scuola di parkour a Padova con corsi per bambini dai 3 anni, ragazzi e adulti, coach professionisti qualificati e lezione di prova gratuita.
hero:
  tag: Uncensored Runners · Scuola di parkour a Padova
  title_1: Imparare a muoversi,
  title_2: con fiducia,
  lead: L'arte dello spostamento per tutti, in sicurezza. Da 10 anni pionieri della disciplina in Italia, con corsi per bambini dai 3 anni, ragazzi e adulti.
  image: /uploads/parkour-padova-284b2b.jpg
  button: Prenota la prova gratuita
  button_2: Vedi i corsi
  stats:
  - value: 10+
    label: anni di esperienza
  - value: 3+
    label: anni, età minima
  - value: CSEN
    label: formazione nazionale istruttori
  title_3: a ogni età.
quote:
  eyebrow: L'arte dello spostamento per tutti, in sicurezza
  text: 'Il parkour è libertà. Libertà fisica di muoversi, esplorare e cambiare punto di vista. Libertà di ri-scoprire le capacità del proprio corpo e di ri-posizionarsi nell''ambiente che ci circonda. Una libertà viva che, passo dopo passo, salto dopo salto, si trasforma in una danza silenziosa: l''Arte di spostarsi come solo l''animale uomo può fare, consapevolmente e coraggiosamente.'
  author: Elia Landolfi
  role: Fondatore di Uncensored Runners e responsabile nazionale del settore parkour C.S.E.N.
  image: /uploads/foto-fondatore-parkour-padova.jpg
