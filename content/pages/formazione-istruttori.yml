  text: INTRODUZIONE E REGOLAMENTO
  level: 2
- type: text
  body: |-
    La nostra formazione ha come scopo la promozione, l’aggiornamento e lo sviluppo delle competenze degli insegnanti e dei praticanti di Parkour/A.D.D. (Art Du Deplacement)/Freerunning.

    Per garantire il perseguimento di tali scopi la nostra formazione include teoria e pratica di:
     1. Valori e concetti fondamentali della disciplina;
     2. Tecniche specifiche della disciplina;
     3. Competenze comunicative e didattiche generali e caratteristiche della disciplina;
     5. Fondamenti di anatomia, fisiologia dell’attività fisica e di biomeccanica;
     6. Storia e critica della disciplina

    La formazione è divisa in 4 livelli diversi di approfondimento, ognuno accertato da un esame finale.

    **Allenatore:** 60 ore di formazione in presenza (5 weekend), 100 ore (minimo) di pratica individuale e 100 ore (indicative) di studio.

    Abilita all’erogazione di classi di livello base (indicativamente 0/1 anni di pratica) – introduzione alla pratica e alle tecniche elementari, preparazione fisica di base –, indoor e outdoor, a basso rischio – a terra e piccole arrampicate – e con impatti ridotti e all’affiancamento di istruttori di livello superiore in classi ed eventi più avanzati. Non abilita all’insegnamento di movimenti acrobatici.

    **Istruttore 1° livello:** qualifica da allenatore + 96 ore di formazione in presenza (8 weekend), 200 ore (minimo) di pratica individuale e 100 ore (indicative) di studio.

    Abilita all’erogazione di classi e lezioni individuali di livello intermedio (2/3 anni di pratica) – tecniche del parkour, preparazione fisica completa, pratica approfondita –, indoor e outdoor, a medio rischio – fino a 1,5m e arrampicate controllate) e con impatti consistenti – senza superare l’intensità gestibile a piedi scalzi dal praticante – e all’affiancamento di istruttori di livello superiore in classi ed eventi più avanzati. Non abilita all’insegnamento di movimenti acrobatici.

    **Istruttore 2°livello:** qualifica da istruttore di 1º livello + 120 ore di formazione in presenza (10 weekend), 500 ore (minimo) di pratica individuale e 100 ore (indicative) di studio.

    Abilita all’erogazione di classi e lezioni individuali di livello avanzato (3+ anni di pratica e classi specifiche – parkour per l’autodifesa, parkour soft, parkour fitness, ecc.), indoor e outdoor, anche ad alto rischio e con impatti al limite delle possibilità soggettive ma nel rispetto della salute a lungo termine dei praticanti. Abilita anche all’insegnamento dei movimenti acrobatici approfonditi dall’istruttore durante il suo percorso formativo.

    **Maestro formatore:** qualifica da istruttore di 2º livello + 240 ore di formazione in presenza (20 weekend), 1000 ore (minimo) di pratica individuale e 200 ore (indicative) di studio.

    Abilita alla formazione degli allenatori e degli istruttori di 1º e 2º livello.

    Gli esami di abilitazione vengono considerati superato al raggiungimento di un punteggio pari o superiore all’85% in tutte le prove a cui viene sottoposto (fisica, teorica, di insegnamento). Al fine della valutazione del monte ore necessario al conseguimento di ciascuna certificazione concorrono sia la partecipazione alle formazioni ufficiali, sia la partecipazione alle eventuali classi tenute da un responsabile di livello superiore, sia le capacità e le conoscenze personali pregresse, che possono essere valutate con un test delle competenze su richiesta.

    Al termine del corso, superati i relativi esami teorico-pratici, saranno rilasciati: IL DIPLOMA NAZIONALE ed il TESSERINO TECNICO di Istruttore. Il corso è riservato ai soci CSEN. In caso di esito negativo, si ha la possibilità di ripetere un’altra volta gratuitamente l’esame, dopo un colloquio personale con il responsabile della formazione per stabilire un piano di studio adatto.

    Ogni anno è richiesto il rinnovo del tesserino tecnico e la partecipazione ad almeno un weekend di aggiornamento.

    Per info e iscrizioni: Info@uncensoredrunners.com - 3423162883

    **COSTI:** modulo singolo (mezza giornata) 40€, due moduli 70€, weekend intero 120€.
