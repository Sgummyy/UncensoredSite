    - type: text
      body: |-
        **Un corso per scoprire gli aspetti più raffinati dell’arte dello spostamento e tenersi in forma all’aria aperta, con cenni di meditazione in movimento.**

        Lavoriamo sulle tecniche e sui principi fondamentali del parkour, con un'attenzione particolare agli aspetti posturali e alla prevenzione degli infortuni, per imparare a muoversi in libertà ma senza dolore.

