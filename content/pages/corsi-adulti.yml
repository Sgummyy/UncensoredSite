- type: text
  body: |-
    Il parkour e il movimento, per noi, sono strumenti per conoscere meglio sé stessi e coltivare un corpo e una mente forti, capaci e in salute.

    I nostri corsi sono dedicati a chiunque abbia il desiderio di approfondire la disciplina e/o lo studio del proprio corpo, **a qualsiasi età e a qualsiasi livello**.

    **NOTA BENE:**

    1) le età sono indicative, ogni esercizio viene adattato alle esigenze e possibilità di ognuno.

    2) I corsi possono essere complementari
